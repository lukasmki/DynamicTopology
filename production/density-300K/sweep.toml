# Density of bulk water at 300 K, by NVT equilibration then NPT production.
#
# Not a sweep in the sense `stoichiometry-3000K` is: there is no variable being
# scanned.  The measurement is a single number -- the density this force field
# settles at under 1 bar at 300 K -- and the three seeds exist to put an error
# bar on it rather than to compare anything.  The file has the same shape as the
# other sweep's so that `run_one.py` stays the same program: an index selects a
# run, and the resolved parameters land in `output/<run_id>/config.json`.

[sweep]
name = "density-300K"
# Replicates.  20 ps of NPT is only a few volume-relaxation times, so a single
# trajectory would give a density with no way to tell its uncertainty.  Three is
# the minimum that yields a spread; it does not make the answer more accurate,
# only more honest about how accurate it is.
seeds = [1, 2, 3]

[system]
# 64 waters is the size `datasets/Water/README.md` validated (12.43 A cube at
# 997 kg/m^3, forces finite, NVE drift 0.002 meV/atom).  At ambient density the
# box edge is ~12.4 A, so the half-box is ~6.2 A -- comfortably outside the 3.5 A
# bimolecular cutoff below, which is what the minimum-image convention needs.
#
# **This constrains how far the box may contract.**  Every force field here uses
# bare minimum image, so the model stops being well defined if the cell shrinks
# toward twice the interaction range.  Expansion is safe; contraction is what to
# watch, and `density.py` reports the final edge for that reason.
molecules = 64
# Starting density, ambient liquid water.  It is a starting point and not an
# assumption: the barostat moves the box away from it, and the whole result is
# where it goes.
density = 997.0
rnet = "datasets/Water/Water.json"

[md]
temperature = 300.0  # K
# 0.5 fs.  `datasets/Water/README.md` measures the fastest mode on this surface
# at 4359 cm^-1 (the h2o O-H stretch), just under the 4400 cap the fit applies.
# Velocity Verlet wants ~15 steps per period, so
#
#     dt_max [fs] = 33356 / (15 * 4359) = 0.51 fs
#
# It was 4386 before the ZBL taper's refit, 4354 after it, and 4359 after the
# 12-6 was switched back on -- three refits inside 0.7%, which is the atomization
# condition doing its job: it pins each template's energy exactly and leaves the
# curvature nearly free, so a change to the repulsion moves this hardly at all.
#
# Re-read that number after any refit rather than carrying this one across; see
# the same discussion in `../stoichiometry-3000K/sweep.toml`.
timestep = 0.5
interval = 20  # a frame every 10 fs

[nvt]
# 5 ps at fixed volume, to relax the packing before the box is allowed to move.
# `molify.pack` produces a non-overlapping random arrangement, not an
# equilibrated liquid: the packed box has 2.17 A closest O-O contacts against
# the 2.8 A of real water, and it releases enough energy on relaxing to spike
# the temperature to ~1500 K before the thermostat takes it back.  Handing that
# to a barostat directly would rescale the cell against a pressure that is
# mostly packing artifact.
#
# Measured: the pressure falls from +267 kbar to a ~+165 kbar plateau within
# ~300 fs and then stops falling, so 5 ps is many relaxation times.
steps = 10000
friction = 0.01  # 1/fs

[npt]
# 20 ps at 1 bar.  Water's volume relaxation time is 1-10 ps, so this is a few
# relaxation times and no more: the density it yields carries a several-percent
# statistical error, which is what the seeds are for.  Longer would be better
# and costs proportionally; see README for the arithmetic.
steps = 40000
pressure = 1.0  # bar
taut = 100.0    # fs, thermostat coupling
# Barostat coupling, deliberately slow.  The box must move on a timescale the
# liquid can follow; a fast barostat converts the instantaneous virial -- which
# in a dense liquid is a near-cancellation of two very large numbers and is
# correspondingly noisy -- directly into cell noise.
taup = 1000.0   # fs
# Isothermal compressibility of water at 300 K, 1/bar.  It sets how fast the box
# responds to a pressure error, not where it settles, so it is a rate and not an
# assumption about the answer.
compressibility = 4.57e-5
# Discarded before averaging, in fs.  The box starts at 997 kg/m^3 and has to
# travel to wherever the model actually sits; averaging from t=0 would bias the
# result toward the starting density.
equilibration = 5000.0

[evb]
# Restrictions on EVB state generation, pinned here because they change the
# potential energy surface -- the density measured is a property of these
# numbers, which is why `run_one.py` copies them into every `config.json`.
#
# `eps` is the principled lever.  It is the stabilization a channel must supply
# to enter the basis, and the default 1e-3 eV admits very nearly everything; at
# 0.05 eV (2 kT at 300 K) only channels that genuinely mix survive.  Raising it
# stays smooth, because `basis.py` ramps a coupling up from zero across
# [eps, eps + switch_width] rather than switching it on at a threshold, and it
# never sets `Block.capped`.
eps = 0.05
switch_width = 0.05
# `max_states` and `max_depth` are hard caps and are different in kind: they
# refuse a state outright, which makes the surface seed-dependent wherever they
# fire.  They are here as a ceiling on cost, not as the mechanism -- `ncapped`
# in the log says whether they ever actually bit, and it should stay zero.
max_states = 16
max_depth = 2
# 3.5 A rather than the 4.0 default.  Water's O-O first shell is at 2.8 A and
# its H-bond O-H at 1.8 A, so every hydrogen-bonded pair is still inside this;
# what it drops is second-shell pairs that were being enumerated as reaction
# channels and rejected.  Measured on the 64-water box: 2.54 -> 1.45 s per force
# call, a 1.75x speedup, with the total energy unchanged to all printed digits.
bimol_cutoff = 3.5
