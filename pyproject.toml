[project]
name = "DynamicTopology"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lukasmki", email = "lukasarus@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ase>=3.26.0",
    "h5py>=3.15.1",
    "molify>=0.2.1",
    "networkx>=3.5",
    "superpose3d",
    "torch>=2.10.0",
    "torchpose3d",
]

[project.scripts]
dt = "DynamicTopology:main"

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "DynamicTopology"

[tool.uv.sources]
torchpose3d = { git = "https://github.com/lukasmki/torchpose3d.git" }
superpose3d = { git = "https://github.com/jewettaij/superpose3d" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "pytest>=9.0.2",
]
