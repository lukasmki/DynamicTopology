[project]
name = "DynamicTopology"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lukasmki", email = "lukasarus@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ase>=3.26.0",
    "molify>=0.2.1",
    "networkx>=3.5",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.scripts]
dt = "DynamicTopology:main"

[build-system]
requires = ["uv_build>=0.9.1,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "DynamicTopology"


[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.11.1",
    "pytest>=9.0.2",
    "sphinx>=9.1.0",
]
